<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0d1b"/>
  <meta name="color-scheme" content="dark light"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="description" content="The Starry Palace — a home for reading, writing, creative communities and collected worlds."/>
  <meta property="og:title" content="The Starry Palace"/>
  <meta property="og:description" content="Read deeply, write privately before you publish, and gather with kindred stars."/>
  <meta property="og:type" content="website"/>
  <meta name="twitter:card" content="summary"/>
  <meta name="twitter:title" content="The Starry Palace"/>
  <meta name="twitter:description" content="A home for reading, writing, creative communities and collected worlds."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"/>
  <title>The Starry Palace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23080a19'/%3E%3Cpath d='M42 45A22 22 0 1 1 25 9a18 18 0 1 0 17 36Z' fill='%23d7d2ff'/%3E%3Cpath d='m45 12 2.2 6.2L53 21l-5.8 2.4L45 30l-2.2-6.6L37 21l5.8-2.8Z' fill='%23a69be9'/%3E%3C/svg%3E">
  <style>
    #palace-boot{
      position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;
      min-height:100dvh;padding:24px;background:#080a19;color:#ddd6ef;
      font-family:"DM Sans",system-ui,sans-serif;
      background-image:
        radial-gradient(circle at 18% 22%,rgba(119,83,174,.14),transparent 24rem),
        radial-gradient(circle at 80% 10%,rgba(74,108,169,.08),transparent 22rem);
    }
    #palace-boot[hidden]{display:none!important}
    #palace-boot>div{
      width:min(92vw,420px);padding:22px;border:1px solid rgba(194,174,226,.16);
      border-radius:20px;background:rgba(23,19,48,.84);text-align:center;
      box-shadow:0 24px 70px rgba(0,0,0,.24);
    }
    #palace-boot .moon{display:block;margin:0 auto 12px;font:34px Georgia,serif;color:#d7c9ed}
    #palace-boot h1{margin:0 0 8px;font:600 20px "Playfair Display",Georgia,serif}
    #palace-boot p{margin:0;color:#9c93aa;font-size:13px;line-height:1.5}
    #palace-boot button{
      display:none;margin:16px auto 0;min-height:38px;padding:8px 14px;border:1px solid rgba(205,182,237,.22);
      border-radius:999px;background:rgba(110,80,174,.12);color:#e1d7ee;font:600 12px "DM Sans",sans-serif;
    }
    #palace-boot[data-failed="true"] button{display:inline-block}
  </style>
  <script>
    (function(){
      var KEY='palace-pre-react-recovery';
      var started=Date.now();
      var retrying=false;
      function storageGet(key){try{return Number(sessionStorage.getItem(key)||0)}catch(e){return 0}}
      function storageSet(key,value){try{sessionStorage.setItem(key,String(value))}catch(e){}}
      function bootNode(){return document.getElementById('palace-boot')}
      function showFailure(reason){
        var boot=bootNode();if(!boot)return;
        boot.hidden=false;boot.dataset.failed='true';
        var title=boot.querySelector('h1');var copy=boot.querySelector('p');
        if(title)title.textContent='The Palace did not finish opening.';
        if(copy)copy.textContent='A stale or interrupted page load was caught before the screen could stay blank. Tap restore if it does not recover automatically.';
        boot.dataset.reason=String(reason||'startup');
      }
      function hasMounted(){
        var root=document.getElementById('root');
        return !!(root&&root.querySelector('[data-palace-frame="ready"],.route-recovery,.route-loading'));
      }
      function retry(reason){
        if(retrying||hasMounted())return;
        retrying=true;
        var now=Date.now(),last=storageGet(KEY);
        showFailure(reason);
        if(now-last<20000)return;
        storageSet(KEY,now);
        window.setTimeout(function(){
          try{
            var url=new URL(window.location.href);
            url.searchParams.set('__palace_recover',String(Date.now()));
            window.location.replace(url.toString());
          }catch(e){window.location.reload()}
        },220);
      }
      window.__palaceBootFailure=retry;
      window.__palaceBootReady=function(){
        var boot=bootNode();if(boot)boot.hidden=true;
        try{sessionStorage.removeItem(KEY)}catch(e){}
      };
      window.addEventListener('error',function(event){
        if(hasMounted())return;
        var target=event&&event.target;
        if(target&&target.tagName==='SCRIPT')retry('entry-script');
        else if(Date.now()-started<12000)window.setTimeout(function(){if(!hasMounted())retry('startup-error')},80);
      },true);
      window.addEventListener('unhandledrejection',function(){
        if(!hasMounted()&&Date.now()-started<12000)window.setTimeout(function(){if(!hasMounted())retry('startup-rejection')},80);
      });
      document.addEventListener('DOMContentLoaded',function(){
        var root=document.getElementById('root');
        if(root&&window.MutationObserver){
          var observer=new MutationObserver(function(){
            if(hasMounted()){observer.disconnect();window.__palaceBootReady()}
          });
          observer.observe(root,{childList:true,subtree:true});
        }
        window.setTimeout(function(){if(!hasMounted())retry('empty-root')},3500);
        window.setTimeout(function(){if(!hasMounted())showFailure('empty-root-persisted')},7000);
      });
    })();
  </script>
</head>
<body>
  <div id="palace-boot" role="status" aria-live="polite">
    <div>
      <span class="moon" aria-hidden="true">☾ ✦</span>
      <h1>Opening The Starry Palace…</h1>
      <p>Gathering your rooms, drafts and moonlight.</p>
      <button type="button" onclick="window.location.reload()">Restore the Palace</button>
    </div>
  </div>
  <div id="root"></div>
  <script id="palace-entry" type="module" src="/src/main.jsx" onerror="window.__palaceBootFailure&&window.__palaceBootFailure('module-load')"></script>
</body>
</html>
