name: Edition credit policy fixture
on:
  pull_request:
    paths:
      - database/review/guest-archive-translation-credits.sql
      - tests/postgres/guest-edition-credits.sql
      - tests/postgres/restored-edition-credits.sql
      - .github/workflows/edition-credit-policy.yml
permissions:
  contents: read
jobs:
  guest-edition-credits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run policy assertions on disposable PostgreSQL
        run: |
          pg_virtualenv bash -eu -c '
            createdb palace_credits_fixture
            psql -X -d palace_credits_fixture -f tests/postgres/guest-edition-credits.sql
            psql -X -v ON_ERROR_STOP=1 -d palace_credits_fixture -f database/review/guest-archive-translation-credits.sql
            pg_dump -Fc -f "$RUNNER_TEMP/edition-credits.dump" palace_credits_fixture
            createdb palace_credits_restored
            pg_restore --exit-on-error -d palace_credits_restored "$RUNNER_TEMP/edition-credits.dump"
            psql -X -v ON_ERROR_STOP=1 -d palace_credits_restored -f tests/postgres/restored-edition-credits.sql
          '
