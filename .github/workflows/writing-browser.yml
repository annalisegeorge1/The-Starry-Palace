name: Writing desk browser rehearsal
on:
  pull_request:
    paths:
      - src/liveRooms.jsx
      - src/palaceData.js
      - src/chapterCloudSave.js
      - src/manuscriptSaveCoordinator.js
      - tests/browser/writing*
      - .github/workflows/writing-browser.yml
permissions:
  contents: read
jobs:
  writing-conflict:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install playwright==1.55.0
      - name: Rehearse stale save, export, history and restore
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4174
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/writer-vite.log 2>&1 &
          trap 'kill $! || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail -s http://127.0.0.1:4173/tests/browser/writing.html >/dev/null
          python tests/browser/writing_conflict.py
