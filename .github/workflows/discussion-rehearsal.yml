name: Discussion moderation rehearsal
on:
  pull_request:
    paths:
      - database/review/discussions/**
      - .github/workflows/discussion-rehearsal.yml
permissions:
  contents: read
jobs:
  discussion:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehearse discussion permissions and concurrency in disposable PostgreSQL
        run: |
          set -euo pipefail
          qa_dir="$(mktemp -d)"
          trap 'rm -rf "$qa_dir"' EXIT
          cp database/review/discussions/{*.sql,rehearse.mjs} "$qa_dir/"
          npm install --prefix "$qa_dir" --no-audit --no-fund --save-exact embedded-postgres@18.6.0-beta.19 pg@8.23.1
          node "$qa_dir/rehearse.mjs"
