name: Reading progress concurrency rehearsal
on:
  pull_request:
    paths:
      - database/review/reading-progress/**
      - src/readerProgressSession*
      - src/palaceData.js
      - src/liveRooms.jsx
      - .github/workflows/reading-progress-rehearsal.yml
  push:
    branches: [main]
    paths:
      - database/review/reading-progress/**
      - src/readerProgressSession*
      - src/palaceData.js
      - src/liveRooms.jsx
      - .github/workflows/reading-progress-rehearsal.yml
permissions:
  contents: read
jobs:
  reading-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise concurrent readers in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          qa_dir="$(mktemp -d)"
          trap 'rm -rf "$qa_dir"' EXIT
          cp database/review/reading-progress/{*.sql,rehearse.mjs} "$qa_dir/"
          npm install --prefix "$qa_dir" --no-audit --no-fund --save-exact embedded-postgres@18.6.0-beta.19 pg@8.23.1
          node "$qa_dir/rehearse.mjs"
