name: Reader eligibility and viewport checks
on:
  pull_request:
    paths:
      - src/DirectClassicReader*
      - src/directClassicApi.js
      - src/direct-classic-reader.css
      - tests/browser/reader_eligibility.py
      - .github/workflows/reader-eligibility.yml
permissions:
  contents: read
jobs:
  reader-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install playwright==1.55.0
      - name: Build and check reader flows using synthetic records
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:4174
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/reader-vite.log 2>&1 &
          trap 'kill $! || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail -s http://127.0.0.1:4173/ >/dev/null
          python tests/browser/reader_eligibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-reader-views
          path: reader-qa/
          retention-days: 7
