name: Palace build checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test and build
        run: npm run verify
      - name: Offline backup safety checks
        shell: bash
        run: |
          bash -n scripts/security/owner-backup.sh
          if env -u PALACE_DB_URL -u PALACE_BACKUP_PARENT -u AGE_RECIPIENT -u AGE_IDENTITY_FILE bash scripts/security/owner-backup.sh >/tmp/palace-backup-negative.log 2>&1; then
            echo "Owner backup unexpectedly ran without credentials" >&2
            exit 1
          fi
          grep -q 'PALACE_DB_URL' /tmp/palace-backup-negative.log
