name: Observatory disposable PostgreSQL proposal review

# Never deploys, logs into Supabase, uses repository secrets or reaches live data.
on:
  pull_request:
    branches: [main]
    paths:
      - 'database/palace-observatory-stage-*-PROPOSAL.sql'
      - 'tests/sql/palace-observatory-postgres-*.sql'
      - '.github/workflows/palace-observatory-postgres-review.yml'

permissions:
  contents: read

jobs:
  ephemeral-postgres-sql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-only-ci
          POSTGRES_DB: observatory_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d observatory_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ephemeral-only-ci
      PGDATABASE: observatory_ci
    steps:
      - uses: actions/checkout@v4
      - name: Use disposable PostgreSQL service, never Supabase
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 -c 'SELECT version();'
      - name: Reject a completely unrelated database with no stage sentinel
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE observatory_unknown_ci'
          for file in database/palace-observatory-stage-*-PROPOSAL.sql; do
            if psql -X -v ON_ERROR_STOP=1 -d observatory_unknown_ci -f "$file" >/dev/null 2>&1; then
              echo "UNSAFE: proposed SQL accepted an unrelated database"
              exit 1
            fi
          done
      - name: Bootstrap staging-shaped fictional security fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/palace-observatory-postgres-bootstrap.sql
      - name: Rehearse recovery with matching PostgreSQL tools
        run: |
          # All data is synthetic and stays inside the temporary service.
          # Matching server/client versions avoid unsupported dump settings.
          cid="$(docker ps -q --filter ancestor=postgres:${{ matrix.postgres }} | head -n 1)"
          test -n "$cid"
          docker exec --user postgres "$cid" pg_dump -Fc --no-owner \
            -f /tmp/observatory-fixture-recovery.dump observatory_ci
          docker exec --user postgres "$cid" createdb observatory_recovery_ci
          docker exec --user postgres "$cid" pg_restore --exit-on-error \
            --no-owner -d observatory_recovery_ci \
            /tmp/observatory-fixture-recovery.dump
          restored="$(docker exec --user postgres "$cid" psql -X \
            -v ON_ERROR_STOP=1 -d observatory_recovery_ci -Atc "
              SELECT CASE WHEN
                (SELECT count(*) FROM public.works)=1
                AND to_regclass('public.profiles') IS NULL
                AND to_regclass('private.staging_chat_rooms') IS NOT NULL
                AND (SELECT count(*) FROM pg_policies
                     WHERE schemaname='public' AND tablename='works')=1
                AND has_function_privilege('anon','public.give_palace_praise(text,uuid,text)','EXECUTE')
                AND has_function_privilege('authenticated','public.record_palace_share(uuid)','EXECUTE')
              THEN 'ready' ELSE 'mismatch' END
            ")"
          test "$restored" = ready
          docker exec --user postgres "$cid" rm -f /tmp/observatory-fixture-recovery.dump
      - name: Apply proposed additive metadata schema to temporary DB
        run: psql -X -v ON_ERROR_STOP=1 -f database/palace-observatory-stage-additive-schema-PROPOSAL.sql
      - name: Compile the unchanged invoker-based published-search SQL
        run: psql -X -v ON_ERROR_STOP=1 -f database/palace-observatory-stage-published-search-PROPOSAL.sql
      - name: Apply isolated age-13 correction to temporary DB
        run: psql -X -v ON_ERROR_STOP=1 -f database/palace-observatory-stage-age-13-PROPOSAL.sql
      - name: Revoke anonymous reward-mutation RPC access only in disposable DB
        run: psql -X -v ON_ERROR_STOP=1 -f database/palace-observatory-stage-mutation-rpc-grants-PROPOSAL.sql
      - name: Verify synthetic rights, public metadata, and private chapters
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/palace-observatory-postgres-smoke.sql
      - name: Reject accidental schema replay after the first installation
        run: |
          if psql -X -v ON_ERROR_STOP=1 -f database/palace-observatory-stage-additive-schema-PROPOSAL.sql >/dev/null 2>&1; then
            echo "UNSAFE: staging additive schema did not reject replay"
            exit 1
          fi
      - name: Reject accidental reward RPC permission replay
        run: |
          if psql -X -v ON_ERROR_STOP=1 -f database/palace-observatory-stage-mutation-rpc-grants-PROPOSAL.sql >/dev/null 2>&1; then
            echo "UNSAFE: staging RPC permission proposal did not reject replay"
            exit 1
          fi
