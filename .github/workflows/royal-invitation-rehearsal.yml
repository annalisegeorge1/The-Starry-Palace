name: Royal invitation database rehearsal
on:
  pull_request:
    paths:
      - database/review/royal-invitations/**
      - supabase/functions/palace-invitations/**
      - .github/workflows/royal-invitation-rehearsal.yml
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise private ledger and Treasury in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          qa_dir="$(mktemp -d)"
          cp database/review/royal-invitations/{*.sql,rehearse.mjs} "$qa_dir/"
          npm install --prefix "$qa_dir" --no-audit --no-fund embedded-postgres@18.6.0-beta.19
          node "$qa_dir/rehearse.mjs" "$PWD/supabase/migrations/20261111010000_palace_age_safe_outbound_invitations.sql" | tee "$qa_dir/results"
          grep -Fx '20 groups passed' "$qa_dir/results"
